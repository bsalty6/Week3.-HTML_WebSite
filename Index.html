<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Greatest Minnesota Vikings Players of All Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background-color: #301462;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .header-row {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 20px;
      min-height: 100vh;
      width: 100%;
      box-sizing: border-box;
      padding: 0 20px;
    }
    .stripe {
      width: 100px;
      flex-shrink: 0;
      background-image: url('images/stripe.jpg');
      background-repeat: repeat-y;
      background-size: 100px auto;
      background-position: top center;
    }
    .heading-text {
      flex: 1;
      max-width: 700px;
      padding-top: 60px;
    }
    h1 {
      font-family: 'Anton', Arial, sans-serif;
      color: #C6A960;
      margin: 4px 0;
      letter-spacing: 1px;
    }
    h4 {
      font-family: 'Oswald', Arial, sans-serif;
      color: #FFFFFF;
      font-weight: 400;
      margin: 8px 0 0;
    }
  </style>
</head>
<body>
  <div class="header-row">
    <div class="stripe left"></div>
    <div class="heading-text">
      <h1>The Greatest Minnesota Vikings</h1>
      <h1>Players of All Time</h1>
      <h4><sub>In My Opinion</sub></h4>
    </div>
    <div class="stripe right"></div>
  </div>
</body>
</html>
